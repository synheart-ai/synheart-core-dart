name: Publish to pub.dev

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
    # Gate the pub.dev publish on the same checks CI runs on main. Previously
    # `publish` fired independently of CI, so a tag whose tests failed (e.g. the
    # version-sync guard) could still ship to pub.dev — and a published version
    # is immutable. Publishing now waits for format, analyze, tests, and a
    # packaging dry-run to pass.
    verify:
        name: Verify before publish
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                  flutter-version: '3.38.7'
                  channel: 'stable'

            - name: Configure git auth for source dependencies
              env:
                  GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
              run: |
                  if [ -z "${GH_TOKEN}" ]; then
                    echo "::warning::ORG_READ_TOKEN secret is not set; some source dependencies may fail to fetch."
                  else
                    git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
                  fi

            - name: Install dependencies
              run: flutter pub get

            - name: Verify formatting
              run: dart format --output=none --set-exit-if-changed .

            - name: Analyze code
              run: flutter analyze --no-fatal-infos

            - name: Run tests
              run: flutter test

            - name: Publish dry-run
              run: dart pub publish --dry-run

    publish:
        needs: verify
        permissions:
            id-token: write # Required for authentication using OIDC
            contents: read
        uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
