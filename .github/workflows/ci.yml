name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  analyze:
    name: Analyze and Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synheart-core-dart

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: synheart-core-dart
      - name: Checkout synheart-wear-dart
        uses: actions/checkout@v4
        with:
          repository: synheart-ai/synheart-wear-dart
          path: synheart-wear-dart
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Checkout synheart-session-dart
        uses: actions/checkout@v4
        with:
          repository: synheart-ai/synheart-session-dart
          path: synheart-session-dart
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Checkout synheart-behavior-dart
        uses: actions/checkout@v4
        with:
          repository: synheart-ai/synheart-behavior-dart
          path: synheart-behavior-dart
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Checkout synheart-auth-dart
        uses: actions/checkout@v4
        with:
          repository: synheart-ai/synheart-auth-dart
          path: synheart-auth-dart
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Check publish readiness
        run: dart pub publish --dry-run

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: synheart-core-dart

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        flutter: [pinned, latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: synheart-core-dart
      - name: Checkout synheart-wear-dart
        uses: actions/checkout@v4
        with:
          repository: synheart-ai/synheart-wear-dart
          path: synheart-wear-dart
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Checkout synheart-session-dart
        uses: actions/checkout@v4
        with:
          repository: synheart-ai/synheart-session-dart
          path: synheart-session-dart
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Checkout synheart-behavior-dart
        uses: actions/checkout@v4
        with:
          repository: synheart-ai/synheart-behavior-dart
          path: synheart-behavior-dart
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Checkout synheart-auth-dart
        uses: actions/checkout@v4
        with:
          repository: synheart-ai/synheart-auth-dart
          path: synheart-auth-dart
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Flutter (pinned)
        uses: subosito/flutter-action@v2
        if: matrix.flutter == 'pinned'
        with:
          channel: 'stable'
          flutter-version: '3.38.7'

      - name: Setup Flutter (latest stable)
        uses: subosito/flutter-action@v2
        if: matrix.flutter == 'latest'
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No test directory found, skipping tests"
          fi
        shell: bash

      - name: Test example (if exists)
        run: |
          if [ -d "example" ]; then
            cd example
            flutter pub get
            flutter analyze --no-fatal-infos
          else
            echo "No example directory found, skipping example tests"
          fi
        shell: bash
