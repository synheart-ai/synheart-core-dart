name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  analyze:
    name: Analyze and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'

      # Allows `flutter pub get` to resolve git-source deps that point at
      # private synheart-ai repos. Token scope must include `repo` (or a
      # fine-grained equivalent) — `read:org` alone is not enough.
      - name: Configure git auth for private synheart-ai deps
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::ORG_READ_TOKEN secret is not set. git-source deps from private repos will fail to fetch."
          else
            git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.7'

      - name: Configure git auth for private synheart-ai deps
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::ORG_READ_TOKEN secret is not set. git-source deps from private repos will fail to fetch."
          else
            git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No test directory found, skipping tests"
          fi
        shell: bash

      - name: Analyze example (if exists)
        run: |
          if [ -d "example" ]; then
            cd example
            flutter pub get
            flutter analyze --no-fatal-infos
          else
            echo "No example directory found, skipping example analyze"
          fi
        shell: bash
