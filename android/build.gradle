group 'ai.synheart.core_runtime'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'ai.synheart.core_runtime'
    // Track the compileSdk of the plugins this package sits alongside, and of
    // Flutter's own default. Below theirs, any consumer module that pulls in a
    // dependency requiring a newer SDK fails AAR metadata validation:
    //
    //   Dependency '<artifact>' requires libraries and applications that depend
    //   on it to compile against version 36 or later of the Android APIs.
    //
    // minSdk is deliberately left alone — compileSdk is what you build against,
    // not what you require at runtime, so raising it drops no devices.
    compileSdk 36

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Native .so files are provisioned by `synheart install runtime`, which
    // places them at <host-flutter-app>/synheart/vendor/runtime/android/jniLibs/
    // (e.g. example/synheart/... in this repo). When this module is built as a
    // subproject of a Flutter app, `rootProject.projectDir` is that app's
    // android/ folder, so parent = the app pubspec root. When opened standalone,
    // parent = the plugin package root (same as $rootDir/..).
    // Override by setting `synheart.runtime.android.jniLibs` in gradle.properties.
    sourceSets {
        main {
            jniLibs.srcDirs = [
                project.findProperty('synheart.runtime.android.jniLibs')
                    ?: new File(rootProject.projectDir.parentFile,
                        'synheart/vendor/runtime/android/jniLibs').absolutePath
            ]
        }
    }
}
