name: synheart_core
description: Synheart Core SDK - The unified SDK for HSI-compatible data collection, on-device state representation, optional interpretation modules (Focus, Emotion), and Syni integration. Includes HSI Runtime, Wear, Phone, Behavior, Consent, Cloud Connector, and Syni Hooks modules.
version: 0.0.3
publish_to: none
homepage: https://github.com/synheart-ai/synheart-core-flutter
repository: https://github.com/synheart-ai/synheart-core-flutter
issue_tracker: https://github.com/synheart-ai/synheart-core-flutter/issues
documentation: https://github.com/synheart-ai/synheart-core
topics:
  - health
  - wearables
  - biosignals
  - hsi
  - behavior
license: Apache-2.0

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  # Synheart interpretation SDKs (GitHub release tags)
  synheart_wear:
    git:
      url: https://github.com/synheart-ai/synheart-wear-flutter.git
      ref: v0.3.1
  synheart_session:
    git:
      url: https://github.com/synheart-ai/synheart-session-flutter.git
      ref: v0.2.0
  synheart_behavior:
    git:
      url: https://github.com/synheart-ai/synheart-behavior-flutter.git
      ref: v0.2.1
  synheart_auth:
    git:
      url: https://github.com/synheart-ai/synheart-auth-flutter.git
      ref: v0.1.0

  # FFI for synheart-runtime native library
  ffi: ^2.1.0

  # Core dependencies
  rxdart: ^0.28.0
  collection: ^1.18.0

  # Cryptography for HMAC verification and artifact SHA-256
  crypto: ^3.0.3

  # AEAD encryption (XChaCha20-Poly1305) for artifact encryption-at-rest
  cryptography: ^2.7.0

  # SQLite storage for artifact catalog
  sqflite: ^2.3.0
  path: ^1.9.0

  # Secure storage for consent and sensitive data
  flutter_secure_storage: ^9.0.0

  # Optional: for cloud sync
  http: ^1.1.0
  connectivity_plus: ^6.0.5

  # State management for example app
  provider: ^6.1.1

  # Preferences storage
  shared_preferences: ^2.2.2

  # UUID generation for consent tokens
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.3
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  plugin:
    platforms:
      ios:
        pluginClass: SynheartCorePlugin
      android:
        ffiPlugin: true
        package: ai.synheart.core_runtime

