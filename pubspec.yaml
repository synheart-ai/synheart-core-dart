name: synheart_core
description: Synheart Core SDK - The unified SDK for HSI-compatible data collection, on-device state representation, optional interpretation modules (Focus, Emotion), and Syni integration. Includes HSI Runtime, Wear, Phone, Behavior, Consent, Cloud Connector, and Syni Hooks modules.
version: 1.3.0
publish_to: none
homepage: https://github.com/synheart-ai/synheart-core-flutter
repository: https://github.com/synheart-ai/synheart-core-flutter
issue_tracker: https://github.com/synheart-ai/synheart-core-flutter/issues
documentation: https://github.com/synheart-ai/synheart-core
topics:
  - health
  - wearables
  - biosignals
  - hsi
  - behavior
license: Apache-2.0

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  # Synheart interpretation SDKs (local)
  synheart_wear:
    path: ../synheart-wear-flutter
  synheart_session:
    path: ../synheart-session-flutter
  # synheart_emotion and synheart_focus removed — HSV heads now computed by
  # synheart-runtime and accessed via RuntimeBridge.lastHsv().
  synheart_behavior:
    path: ../synheart-behavior-flutter
  synheart_auth:
    path: ../synheart-auth-flutter

  # FFI for synheart-runtime native library
  ffi: ^2.1.0

  # Core dependencies
  rxdart: ^0.28.0
  collection: ^1.18.0

  # Cryptography for HMAC verification and artifact SHA-256
  crypto: ^3.0.3

  # AEAD encryption (XChaCha20-Poly1305) for artifact encryption-at-rest
  cryptography: ^2.7.0

  # SQLite storage for artifact catalog
  sqflite: ^2.3.0
  path: ^1.9.0

  # Secure storage for consent and sensitive data
  flutter_secure_storage: ^9.0.0

  # Optional: for cloud sync
  http: ^1.1.0
  connectivity_plus: ^6.0.5

  # State management for example app
  provider: ^6.1.1

  # Preferences storage
  shared_preferences: ^2.2.2

  # UUID generation for consent tokens
  uuid: ^4.5.1

dependency_overrides:
  synheart_wear:
    path: ../synheart-wear-flutter
  synheart_behavior:
    path: ../synheart-behavior-flutter
  synheart_auth:
    path: ../synheart-auth-flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.3
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # ML model assets removed — emotion/focus heads deprecated in favour of
  # synheart-runtime inference via RuntimeBridge.lastHsv().

